s who can access your personal information that we store and/or process on our Platform and servers. In addition, we actively prevent third parties from getting access to your personal information that we store and/or process on our Platform and servers. We accept payment by credit card through a third party credit card processor on our behalf. We will implement reasonable security measures every time you (a) enter, submit, or access your information, (b) register, or (c) access our Platform, on our Website\"}}]]}]]}],[\"$\",\"div\",\"7\",{\"className\":\"flex flex-col gap-3\",\"children\":[[\"$\",\"h3\",null,{\"className\":\"text-lg font-bold\",\"children\":[8,\". \",\"DATA SECURITY MEASURES\"]}],[\"$\",\"div\",null,{\"className\":\"flex flex-col gap-3 pl-5\",\"children\":[[\"$\",\"div\",\"section-7-0\",{\"className\":\"flex flex-col gap-3\",\"children\":[[\"$\",\"h4\",null,{\"className\":\"text-base font-semibold\",\"children\":\"a) Security Measures:\"}],[\"$\",\"div\",null,{\"className\":\"flex flex-col gap-2 pl-3 md:pl-5\",\"children\":[[\"$\",\"p\",\"section-7-0-child-0\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"We have implemented measures designed to secure your personal information from accidental loss and from unauthorized access, use, alteration, and disclosure. All information you provide to us is stored on our secure servers behind firewalls. The safety and security of your information also depends on you. Where we have given you (or where you have chosen) a password for access to certain parts of our Website or Platform, you are responsible for keeping this password confidential. We ask you not to share your password with anyone. Unfortunately, the transmission of information via the internet is not completely secure. Although we do our best to protect your personal information, we cannot guarantee the security of your personal information transmitted to our Website or Platform. Any transmission of personal information is at your own risk. We are not responsible for circumvention of any privacy settings or security measures contained on our Website or Platform.\"}}]]}]]}],[\"$\",\"div\",\"section-7-1\",{\"className\":\"flex flex-col gap-3\",\"children\":[[\"$\",\"h4\",null,{\"className\":\"text-base font-semibold\",\"children\":\"b) Fair Information Practice Principles:\"}],[\"$\",\"div\",null,{\"className\":\"flex flex-col gap-2 pl-3 md:pl-5\",\"children\":[[\"$\",\"p\",\"section-7-1-child-0\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"In the event of a personal data breach, we will notify you within fifteen (15) days via email. We shall also notify FTC, FCC, and/or state regulatory agency as required under law and within the time period prescribed by law. We agree to the individual redress principle, which requires that individuals have a right to pursue legally enforceable rights against data collectors and processors who fail to adhere to the law. This principle requires not only that individuals have enforceable rights against data users, but also that that individuals have recourse to courts or a government agency to investigate and/or prosecute non-compliance by data processors.\"}}]]}]]}],[\"$\",\"div\",\"section-7-2\",{\"className\":\"flex flex-col gap-3\",\"children\":[[\"$\",\"h4\",null,{\"className\":\"text-base font-semibold\",\"children\":\"c) Open-Source Software:\"}],[\"$\",\"ol\",null,{\"className\":\"pl-4 md:pl-10 flex flex-col gap-1 list-none pl-3 md:pl-5\",\"children\":[[\"$\",\"li\",\"section-7-2-0\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"We use the following open-source software in the provision of our Services, such as:\"}}],[\"$\",\"li\",\"section-7-2-1\",{\"children\":[\"$undefined\",[\"$\",\"ol\",null,{\"className\":\"pl-4 md:pl-10 flex flex-col gap-1 !list-none pl-3 md:pl-5\",\"children\":[[\"$\",\"p\",\"section-7-2-1-nested-0\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"i) NextJS\"}}],[\"$\",\"p\",\"section-7-2-1-nested-1\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"ii) FastAPI\"}}],[\"$\",\"p\",\"section-7-2-1-nested-2\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"iii) Open Source Java and Python Libraries\"}}]]}]]}]]}]]}]]}]]}],[\"$\",\"div\",\"8\",{\"className\":\"flex flex-col gap-3\",\"children\":[[\"$\",\"h3\",null,{\"className\":\"text-lg font-bold\",\"children\":[9,\". \",\"DISCLOSURE OF PERSONAL INFORMATION\"]}],[\"$\",\"div\",null,{\"className\":\"flex flex-col gap-3 pl-5\",\"children\":[[\"$\",\"p\",\"section-8-0\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"There are times when the Personal Information that you have shared with MW may be shared with others to enable us to provide you over Services, including contractors, service providers, and third parties (“Partners”). This section discusses only how MW may share such information with Partners. We will ensure that our Partners protect your Personal Information. The following describe how and with whom we may share your Personal Information:\"}}],[\"$\",\"div\",\"section-8-1\",{\"className\":\"flex flex-col gap-3\",\"children\":[[\"$\",\"h4\",null,{\"className\":\"text-base font-semibold\",\"children\":\"Disclosure of Personal Information\"}],[\"$\",\"ol\",null,{\"className\":\"pl-4 md:pl-10 flex flex-col gap-1 list-none pl-3 md:pl-5\",\"children\":[[\"$\",\"li\",\"section-8-1-0\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"a) We may disclose aggregated, de-personalized information about you that does not identify any individual to other parties without restriction, such as for marketing, advertising, or other uses.\"}}],[\"$\",\"li\",\"section-8-1-1\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"b) We may disclose personal information to our subsidiaries and affiliates.\"}}],[\"$\",\"li\",\"section-8-1-2\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"c) We may disclose personal information to contractors, service providers, and other third parties.\"}}],[\"$\",\"li\",\"section-8-1-3\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"d) We require all contractors, service providers, and other third parties to whom we disclose your personal information to be under contractual obligations to keep personal information confidential and to use it only for the purposes for which we disclose them.\"}}],[\"$\",\"li\",\"section-8-1-4\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"e) We may disclose to third parties to market their products and services to you if you have either consented or not opted out of these disclosures.\"}}],[\"$\",\"li\",\"section-8-1-5\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"f) We may disclose personal information to third parties to market their products and services if you have either consented or not opted out of these disclosures.\"}}],[\"$\",\"li\",\"section-8-1-6\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"g) We require all other Partners, to whom we disclose your personal information, to enter into contracts with us to keep personal information confidential and use it only for the purposes for which we disclose it to such Partners.\"}}],[\"$\",\"li\",\"section-8-1-7\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"h) We disclose personal information to fulfill the purpose for which you have provided it, for instance, if you gave us an email address to use the 'email a friend' feature of the Platform.\"}}],[\"$\",\"li\",\"section-8-1-8\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"i) We may disclose personal information for any other purpose for which you have provided it.\"}}],[\"$\",\"li\",\"section-8-1-9\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"j) We may only disclose personal information as described in this Privacy Policy or your consent.\"}}]]}]]}],[\"$\",\"div\",\"section-8-2\",{\"className\":\"flex flex-col gap-3\",\"children\":[[\"$\",\"h4\",null,{\"className\":\"text-base font-semibold\",\"children\":\"Other Disclosure of Personal Information\"}],[\"$\",\"ol\",null,{\"className\":\"pl-4 md:pl-10 flex flex-col gap-1 list-none pl-3 md:pl-5\",\"children\":[[\"$\",\"li\",\"section-8-2-0\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"a) We will disclose personal information (i) to comply with any court order, law, or legal process, including to respond to any government or regulatory request, (ii) to enforce or apply our \u003ca href=\\\"/terms-and-conditions\\\" class=\\\"text-blue-500 underline\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003eTerms of Service\u003c/a\u003e and other agreements, including for billing and collection purposes, (iii) if we believe it is necessary or appropriate to protect the rights, property, or safety of MW, our customers, or others, and/or (iv) if it is necessary or appropriate to protect the rights, property, or safety of MW, our customers, or others, and this includes exchanging information with other companies and organizations for the purposes of fraud protection and credit risk reduction.\"}}]]}]]}],[\"$\",\"div\",\"section-8-3\",{\"className\":\"flex flex-col gap-3\",\"children\":[[\"$\",\"h4\",null,{\"className\":\"text-base font-semibold\",\"children\":\"Third Party Disclosure\"}],[\"$\",\"ol\",null,{\"className\":\"pl-4 md:pl-10 flex flex-col gap-1 list-none pl-3 md:pl-5\",\"children\":[[\"$\",\"li\",\"section-8-3-0\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"a) We do not sell, trade, rent, or otherwise transfer personal information to others, unless we provide you with advance notice. This does not include our hosting partners and other parties who assist us in operating our Website or Platform, conducting our business, or servicing you, so long as those parties agree to keep this information confidential.\"}}],[\"$\",\"li\",\"section-8-3-1\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"b) We do not provide non-personally identifiable visitor information for marketing purposes.\"}}]]}]]}],[\"$\",\"div\",\"section-8-4\",{\"className\":\"flex flex-col gap-3\",\"children\":[[\"$\",\"h4\",null,{\"className\":\"text-base font-semibold\",\"children\":\"Choices Users Have About How MW Uses and Discloses Information\"}],[\"$\",\"ol\",null,{\"className\":\"pl-4 md:pl-10 flex flex-col gap-1 list-none pl-3 md:pl-5\",\"children\":[[\"$\",\"li\",\"section-8-4-0\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"a) Tracking Technologies and Advertising. You can set their browser to refuse some or all the browser cookies. Disabling cookies will not impact functionality.\"}}],[\"$\",\"li\",\"section-8-4-1\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"b) Disclosure of Users’ Information for Third-Party Advertising. Users receiving promotional email can opt-out by sending a return email requesting to be omitted from future promotional email distributions. This opt-out will not apply to information provided by MW for registration, or other transactions.\"}}],[\"$\",\"li\",\"section-8-4-2\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"c) Disclosure of User’s Information for Targeted Advertising. Users can opt-out by emailing us their opt-out request at \u003ca href=\\\"mailto:support@melodywings.org\\\" class=\\\"text-blue-500 underline\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003esupport@melodywings.org\u003c/a\u003e.\"}}]]}]]}]]}]]}],[\"$\",\"div\",\"9\",{\"className\":\"flex flex-col gap-3\",\"children\":[[\"$\",\"h3\",null,{\"className\":\"text-lg font-bold\",\"children\":[10,\". \",\"GOOGLE ADSENSE AND GOOGLE ANALYTICS\"]}],[\"$\",\"div\",null,{\"className\":\"flex flex-col gap-3 pl-5\",\"children\":[[\"$\",\"p\",\"section-9-0\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"Google, as a third-party vendor, uses Cookies to serve advertisements to Users on our Website or Platform. Google uses first-party Cookies, such as Google Analytics Cookies, to compile data regarding User interactions with ad impressions and other ad service functions as they relate to our Platform. We currently use Google Analytics to collect and process certain Website usage data. To learn more about Google Analytics and how to opt-out, please visit \u003ca href=\\\"https://policies.google.com/privacy/google-partners\\\" class=\\\"text-blue-500 underline\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003ehttps://policies.google.com/privacy/google-partners\u003c/a\u003e.\"}}],[\"$\",\"p\",\"section-9-1\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"We have implemented advertising features on our Website and Platform including: (a) remarketing with Google AdSense; (b) Google Display Network Impression Reporting; (c) Google Demographics and Interests Reporting; and (d) Google’s DoubleClick platform integration.\"}}],[\"$\",\"p\",\"section-9-2\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"We use these Cookies to compile data regarding User interactions with ad impressions and other ad service functions as they relate to our Website. \"}}]]}]]}],[\"$\",\"div\",\"10\",{\"className\":\"flex flex-col gap-3\",\"children\":[[\"$\",\"h3\",null,{\"className\":\"text-lg font-bold\",\"children\":[11,\". \",\"OTHER PRIVACY RIGHTS\"]}],[\"$\",\"div\",null,{\"className\":\"flex flex-col gap-3 pl-5\",\"children\":[[\"$\",\"div\",\"section-10-0\",{\"className\":\"flex flex-col gap-3\",\"children\":[[\"$\",\"h4\",null,{\"className\":\"text-base font-semibold\",\"children\":\"a) Your California Privacy Rights\"}],[\"$\",\"ol\",null,{\"className\":\"pl-4 md:pl-10 flex flex-col gap-1 list-none pl-3 md:pl-5\",\"children\":[[\"$\",\"li\",\"section-10-0-0\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"$7\"}}],[\"$\",\"li\",\"section-10-0-1\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"\u003cstrong\u003e2) CPRA:\u003c/strong\u003e This Section supplements the information contained in our Privacy Policy above and applies solely to all visitors, users, and others to our Website or Platform, who reside in the State of California (“consumers” or “you”). We adopt this Section to comply with the California Privacy Rights Act that is effective from January 1, 2023 (“CPRA”) and any terms defined in the CPRA have the same meaning when used in this Section. \"}}],[\"$\",\"li\",\"section-10-0-2\",{\"children\":[\"$undefined\",[\"$\",\"ol\",null,{\"className\":\"pl-4 md:pl-10 flex flex-col gap-1 !list-none pl-3 md:pl-5\",\"children\":[[\"$\",\"p\",\"section-10-0-2-nested-0\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"a) Right to Request Personal Information. Upon request, we will provide you with (i) a list of all Personal Information that we have collected on you, (ii) from whom we obtained such Personal Information, (iii) the reason why we collected such Personal Information, and (iv) with whom (if any) we have shared such Personal Information. If we sell your Personal Information or disclose your Personal Information to third parties, upon request, we will provide you with (i) a list of the Personal Information that we have collected on you, (ii) a list of the Personal Information that we sell or disclose to others on you, and (iii) to whom we have sold or disclosed your Personal Information. We require such Personal Information to be able to provide to you, our Services. Unless otherwise specified, we only collect Personal Information from you. We do not use others to provide us with your Personal Information.\"}}],[\"$\",\"p\",\"section-10-0-2-nested-1\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"b) Disclosure of Personal Information. We only share your Personal Information with service providers, e.g., billing and collection agents, who enable us to provide our Services to you. We do not sell or give your Personal Information to third parties for purposes unrelated to our provision of Services to you.\"}}],[\"$\",\"p\",\"section-10-0-2-nested-2\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"c) Right to have Personal Information Deleted. Upon request, we will delete all of your Personal Information that we have collected on you and will direct our Service Providers to also delete all of your Personal Information. But note that if we do delete all of this Personal Information, you will no longer be able to use our Services.\"}}],[\"$\",\"p\",\"section-10-0-2-nested-3\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"d) Non-Discrimination Right. We will not discriminate against you for exercising any of your CPRA rights. Unless permitted by the CPRA, we will not:\"}}],[\"$\",\"div\",\"section-10-0-2-nested-4\",{\"className\":\"flex flex-col gap-3\",\"children\":[\"$undefined\",[\"$\",\"ol\",null,{\"className\":\"pl-4 md:pl-10 flex flex-col gap-1 list-decimal list-outside\",\"children\":[[\"$\",\"li\",\"section-10-0-2-nested-4-0\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"Deny you goods or services\"}}],[\"$\",\"li\",\"section-10-0-2-nested-4-1\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"Charge you different prices or rates for goods or services, including through granting discounts or other benefits, or imposing penalties.\"}}],[\"$\",\"li\",\"section-10-0-2-nested-4-2\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"Provide you a different level or quality of goods or services.\"}}],[\"$\",\"li\",\"section-10-0-2-nested-4-3\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"Suggest that you may receive a different price or rate for goods or services or a different level or quality of goods or services.\"}}]]}]]}],[\"$\",\"p\",\"section-10-0-2-nested-5\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"e) Financial Incentives. However, we may offer you certain financial incentives permitted by the CPRA that can result in different prices, rates, or quality levels. Any CPRA-permitted financial incentive we offer will reasonably relate to your personal information’s value and contain written terms that describe the program’s material aspects. Participation in a financial incentive program requires your prior opt in consent, which you may revoke at any time.\"}}],[\"$\",\"p\",\"section-10-0-2-nested-6\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"f) Contact Information. You may contact us (i) at support@melodywings.org, or (ii) by writing to us at Privacy Officer, at MelodyWings at 9852 Wesbourne Way, Granite Bay - CA 95746 to (i) make a Personal Information Request, (ii) lodge a complaint about our use or storage of your Personal Information, (iii) ask us to delete such Personal Information, and/or (iv) discuss our Privacy Policy and/or anything that has to do with it. We will respond within forty-five (45) days of receiving such request or query. Additionally, in order for us to respond to your request or query, we will need to collect information from the requesting party to verify their identity.\"}}],[\"$\",\"p\",\"section-10-0-2-nested-7\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"g) Under 16. We will not sell your Personal Information of any Users, including any persons under the age of 16.\"}}],[\"$\",\"p\",\"section-10-0-2-nested-8\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"h) Opt In Consent. We will only process, collect, use and store your Personal Information upon receiving your express consent to do so. YOU EXPRESSLY AGREE THAT YOU HAVE READ, UNDERSTOOD, AND CONSENT TO MW COLLECTING, USING, PROCESSING, DISCLOSING, STORING, AND RETAINING YOUR PERSONAL INFORMATION IN ACCORDANCE WITH THIS PRIVACY POLICY AND OUR TERMS OF SERVICE WHEN YOU CHECK THE APPLICABLE BOX SIGNIFYING YOUR CONSENT. YOU EXPRESSLY AGREE THAT THIS CONSENT IS FREELY GIVEN, EXPRESS, AND AFFIRMATIVE.\"}}],[\"$\",\"p\",\"section-10-0-2-nested-9\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"i) Right to Opt-Out. At any time, upon your request, we will stop selling your Personal Information (sometimes called your Opt Out-Right). You may send the request to Opt Out (i) to support@melodywings.org, or (ii) by writing to us at Privacy Officer, MelodyWings at 9852 Wesbourne Way, Granite Bay - CA 95746.\"}}],[\"$\",\"p\",\"section-10-0-2-nested-10\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"j) Data Protection Officer. We have appointed a Privacy and Data Protection Officer, Chitra Ganesan] at [9852 Wesbourne Way, Granite Bay - 95746 to make sure the privacy rights of our Users are protected.\"}}],[\"$\",\"p\",\"section-10-0-2-nested-11\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"k) Personal Information that We Store. For your information, we store/collect the following Personal Information on you:\"}}],[\"$\",\"div\",\"section-10-0-2-nested-12\",{\"className\":\"flex flex-col gap-3\",\"children\":[\"$undefined\",[\"$\",\"ol\",null,{\"className\":\"pl-4 md:pl-10 flex flex-col gap-1 list-none pl-3 md:pl-5\",\"children\":[[\"$\",\"li\",\"section-10-0-2-nested-12-0\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"1. Name\"}}],[\"$\",\"li\",\"section-10-0-2-nested-12-1\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"2. Date of Birth\"}}],[\"$\",\"li\",\"section-10-0-2-nested-12-2\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"3. Gender\"}}],[\"$\",\"li\",\"section-10-0-2-nested-12-3\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"4. Address\"}}],[\"$\",\"li\",\"section-10-0-2-nested-12-4\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"5. Telephone number\"}}],[\"$\",\"li\",\"section-10-0-2-nested-12-5\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"6. Email address\"}}],[\"$\",\"li\",\"section-10-0-2-nested-12-6\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"7. Username\"}}],[\"$\",\"li\",\"section-10-0-2-nested-12-7\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"8. Browsing and search history\"}}],[\"$\",\"li\",\"section-10-0-2-nested-12-8\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"9. ID proof\"}}],[\"$\",\"li\",\"section-10-0-2-nested-12-9\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"10. Education information\"}}],[\"$\",\"li\",\"section-10-0-2-nested-12-10\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"11. Employment based information\"}}],[\"$\",\"li\",\"section-10-0-2-nested-12-11\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"12. Disability history\"}}],[\"$\",\"li\",\"section-10-0-2-nested-12-12\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"13. Legal and Safety Information\"}}]]}]]}]]}]]}]]}]]}],[\"$\",\"div\",\"section-10-1\",{\"className\":\"flex flex-col gap-3\",\"children\":[[\"$\",\"h4\",null,{\"className\":\"text-base font-semibold\",\"children\":\"b) Other State Privacy Rights\"}],[\"$\",\"ol\",null,{\"className\":\"pl-4 md:pl-10 flex flex-col gap-1 list-none pl-3 md:pl-5\",\"children\":[[\"$\",\"li\",\"section-10-1-0\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"This Privacy Policy explains how we collect, use, and disclose your Personal Information in the Sections above. This Section describes how to exercise your rights under the various state privacy laws as detailed below (“State Privacy Laws”)\"}}],[\"$\",\"li\",\"section-10-1-1\",{\"children\":[\"$undefined\",[\"$\",\"ol\",null,{\"className\":\"pl-4 md:pl-10 flex flex-col gap-1 !list-none pl-3 md:pl-5\",\"children\":[[\"$\",\"p\",\"section-10-1-1-nested-0\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"$8\"}}],[\"$\",\"p\",\"section-10-1-1-nested-1\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"ii) Colorado. The Colorado Privacy Act (Colo. Rev. Stat. § 6-1-1301 et seq.) protects the privacy of Colorado consumers. Residents of Colorado have following privacy rights (i) you have the right to opt out of the processing of your personal data for the purposes of targeted advertising, the sale of your personal data or profiling in furtherance of decisions that produce legal or similarly significant effects; (ii) you have the right to confirm whether we are processing personal data concerning you and to access your personal data; (iii) you have the right to correct inaccuracies in your personal data; (iv) you have the right to delete your personal data; and (v) when accessing your data, you have a right to obtain that data in a portable and, to the extent technically feasible, readily usable format that allows you to transmit that data to another business.\"}}],[\"$\",\"p\",\"section-10-1-1-nested-2\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"$9\"}}],[\"$\",\"p\",\"section-10-1-1-nested-3\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"iv) Utah. On March 24, 2022, Utah enacted the Utah Consumer Privacy Act (UCPA § 13-61-102(1)) which will go into effect on December 31, 2023. The UCPA gives residents of Utah who are users of our Website and App the right to (i) you to opt out of the processing of your personal data for the purposes of targeted advertising, the sale or profiling; (ii) correct inaccuracies in your personal data; (iv) delete your personal data; and (v) obtain that data in a portable and, to the extent technically feasible, readily usable format that allows you to transmit that data to another business. \"}}],[\"$\",\"p\",\"section-10-1-1-nested-4\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"v) New York: The New York Privacy Act sets strict rules about how businesses must handle consumers’ personal information and gives individuals new rights concerning data. New York residents have the rights to (i) access, correct, deletion, and disclosure regarding your Personal Information; and (ii) know what personal information is being collected about them, how it is being used, and with whom it is being shared. \"}}],[\"$\",\"p\",\"section-10-1-1-nested-5\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"vi) Virginia. The Virginia Consumer Data Protection Act (Va. Code § 59.1-571 et seq.) effective from January 1, 2023 provides Virginia residents with certain rights regarding the collection, use, and sharing of their personal information namely (i) the right to know what personal information is being collected about them, how it is being used, and with whom it is being shared; (ii) the right to request that a business delete personal information that the business has collected from the resident; (iii) the right to non-discrimination for the exercise of their privacy right; (iv) the right to access the personal information held about them, including the categories of personal information collected, used, shared, and the categories of third parties with whom the information is shared; (v) the right to obtain a copy of their personal information in a structured, commonly used and machine-readable format.\"}}]]}]]}],[\"$\",\"li\",\"section-10-1-2\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"To exercise any of the rights mentioned under Section 11(b), please (i) send an email to \u003ca href=\\\"mailto:support@melodywings.org\\\" class=\\\"text-blue-500 underline\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\"\u003esupport@melodywings.org\u003c/a\u003e, or (ii) write to us at Privacy Officer, MelodyWings at 9852 Wesbourne Way, Granite Bay - CA 95746.\"}}],[\"$\",\"li\",\"section-10-1-3\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"Note that (i) if we delete your Personal Information as requested, we will no longer be able to provide our services to you. We have appointed a Privacy and Data Protection Officer, Chitra Ganesan to make sure the privacy rights of our Users are protected.\"}}]]}]]}]]}]]}],[\"$\",\"div\",\"11\",{\"className\":\"flex flex-col gap-3\",\"children\":[[\"$\",\"h3\",null,{\"className\":\"text-lg font-bold\",\"children\":[12,\". \",\"COPPA COMPLIANCE (FOR CHILDREN UNDER 13 USERS ONLY)\"]}],[\"$\",\"div\",null,{\"className\":\"flex flex-col gap-3 pl-5\",\"children\":[[\"$\",\"p\",\"section-11-0\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"The Children’s Online Privacy Protection Act (“COPPA”) is a federal legislation that applies to entities that collect and store “Personal Information,” as the term is defined under COPPA, from children under the age of 13. We are committed to ensure compliance with COPPA.\"}}],[\"$\",\"p\",\"section-11-1\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"Since MW is a non-profit organization that does not collect personal information from minors under 13 for commercial purposes, it is exempt from COPPA requirements. However, MW is committed to safeguarding the privacy of minors under 13 and takes all necessary measures to ensure their privacy is protected. \"}}],[\"$\",\"div\",\"section-11-2\",{\"className\":\"flex flex-col gap-3\",\"children\":[[\"$\",\"h4\",null,{\"className\":\"text-base font-semibold\",\"children\":\"a) FOR OUR VOLUNTEERS:\"}],[\"$\",\"ol\",null,{\"className\":\"pl-4 md:pl-10 flex flex-col gap-1 list-none pl-3 md:pl-5\",\"children\":[[\"$\",\"li\",\"section-11-2-0\",{\"className\":\"text-base text-justify text-gray-700\",\"dangerouslySetInnerHTML\":{\"__html\":\"To register as a Volunteer on our Website and/or
