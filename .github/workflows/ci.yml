name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck-lint:
    name: Typecheck + Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        # Informational for now — the repo had no ESLint config before this, so a
        # first run surfaces a backlog of pre-existing warnings. Tighten to a hard
        # gate once that backlog is worked down.
        run: npm run lint
        continue-on-error: true
